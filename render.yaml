services:
  - type: web
    name: hrms-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        fromDatabase:
          name: hrms-mongodb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://hrms-frontend-blush.vercel.app
      - key: FRONTEND_URL
        value: https://hrms-frontend-blush.vercel.app
      # Set in Render dashboard (do not commit secrets):
      # REDIS_URL, EMAIL_*, AWS_*, DEEPSEEK_API_KEY / GEMINI_API_KEY

databases:
  - name: hrms-mongodb
    plan: free
    databaseName: hrms
